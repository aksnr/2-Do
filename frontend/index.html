<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2-Do!</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <main class="app">

        <!-- Header -->
        <header class="topnav">
            <div class="brand">
                <div>
                    <h1>2-Do<span>!</span></h1>
                </div>
            </div>

        </header>

        <!-- Add Task -->
        <section class="addtask" aria-label="Add a task">
            <label class="sr-only" for="taskInput">Your task</label>

            <textarea id="taskInput" name="text" rows="2" placeholder="What shall we do today?"></textarea>

            <button id="addTaskBtn" type="button">
                <span aria-hidden="true">＋</span>
                Add Task
            </button>
        </section>

        <!-- Task List -->
        <section class="tasks-section">
            <div class="section-heading">
                <h2>Tasks <span></span></h2>
                <button id="sortBtn" class="list-label" type="button" aria-label="Sort oldest first">YOUR LIST <span
                        class="sort-arrow">↓</span></button>
            </div>

            <div class="taskarea" id="taskarea" aria-live="polite">
                <!-- Tasks will be rendered here by script.js -->
            </div>
        </section>

    </main>
</body>

</html>
